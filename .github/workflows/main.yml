name: Build VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: RetuneLab-Windows
          - os: macos-latest
            name: RetuneLab-Mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          SRC=$(dirname "$(find . -name CMakeLists.txt -not -path './build/*' | head -n 1)")
          echo "Project folder: $SRC"
          if [ "${{ runner.os }}" = "macOS" ]; then
            cmake -S "$SRC" -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_AFTER_BUILD=OFF \
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          else
            cmake -S "$SRC" -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_AFTER_BUILD=OFF
          fi

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          VST=$(find build -name "RetuneLab.vst3" -maxdepth 4 | head -n 1)
          echo "Found: $VST"
          mkdir -p dist
          cp -R "$VST" dist/
          if [ "${{ runner.os }}" = "macOS" ]; then
            codesign --force --deep -s - dist/RetuneLab.vst3
            tar -czf dist/${{ matrix.name }}.tar.gz -C dist RetuneLab.vst3
            rm -rf dist/RetuneLab.vst3
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/
